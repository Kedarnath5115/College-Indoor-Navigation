<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">

  <rect width="900" height="600" fill="#f8fafc"/>

  <text x="450" y="35" text-anchor="middle"
        font-size="24" font-weight="bold" fill="#1e293b">
    Third Floor
  </text>

  <!-- Main Corridor -->
  <rect x="100" y="260" width="700" height="90"
        rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>

  <text x="450" y="310" text-anchor="middle"
        font-size="20" fill="#334155">
    MAIN CORRIDOR
  </text>

  <!-- Top Rooms -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="100" y="80" width="160" height="150" rx="6" id="T301"/>
    <rect x="280" y="80" width="160" height="150" rx="6" id="T302"/>
    <rect x="460" y="80" width="160" height="150" rx="6" id="T303"/>
    <rect x="640" y="80" width="160" height="150" rx="6" id="T304"/>
  </g>

  <!-- Bottom Rooms -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <rect x="100" y="380" width="160" height="150" rx="6" id="T305"/>
    <rect x="280" y="380" width="160" height="150" rx="6" id="T306"/>
    <rect x="460" y="380" width="160" height="150" rx="6" id="T307"/>
    <rect x="640" y="380" width="160" height="150" rx="6" id="T308"/>
  </g>

  <!-- Room Labels -->
  <g font-size="22" font-weight="bold"
     fill="#1e40af" text-anchor="middle">
    <text x="180" y="160">T301</text>
    <text x="360" y="160">T302</text>
    <text x="540" y="160">T303</text>
    <text x="720" y="160">T304</text>

    <text x="180" y="460">T305</text>
    <text x="360" y="460">T306</text>
    <text x="540" y="460">T307</text>
    <text x="720" y="460">T308</text>
  </g>

</svg>